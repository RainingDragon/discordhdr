name: Build DiscordHDRFix v1.2.2 Stream UI Fix Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "native/**"
      - "vencord/**"
      - "Install-DiscordHDRFix.ps1"
      - "Uninstall-DiscordHDRFix.ps1"
      - "install-native.ps1"
      - "README-FIRST.txt"
      - "ARTIFACT-README.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S native -B build -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $injector = "build\Release\DiscordHDRFix.Injector.exe"
          $dll = "build\Release\DiscordHDRFix.Native.dll"

          if (-not (Test-Path $injector)) { throw "Missing $injector" }
          if (-not (Test-Path $dll)) { throw "Missing $dll" }

          Get-Item $injector, $dll | Format-Table Name, Length, LastWriteTime

      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "package\DiscordHDRFix-v1.2.2-stream-ui-fix"
          $native = Join-Path $root "native"
          $plugin = Join-Path $root "vencord\DiscordHDRFix"

          New-Item -ItemType Directory -Force -Path $native | Out-Null
          New-Item -ItemType Directory -Force -Path $plugin | Out-Null

          Copy-Item "build\Release\DiscordHDRFix.Injector.exe" $native
          Copy-Item "build\Release\DiscordHDRFix.Native.dll" $native

          Copy-Item "vencord\DiscordHDRFix\*" $plugin -Recurse -Force

          Copy-Item "Install-DiscordHDRFix.ps1" $root
          Copy-Item "Uninstall-DiscordHDRFix.ps1" $root
          Copy-Item "install-native.ps1" $root
          Copy-Item "README-FIRST.txt" $root
          Copy-Item "ARTIFACT-README.md" $root

          $hashes = @(
            Get-FileHash (Join-Path $native "DiscordHDRFix.Injector.exe") -Algorithm SHA256
            Get-FileHash (Join-Path $native "DiscordHDRFix.Native.dll") -Algorithm SHA256
          )

          $hashes |
            ForEach-Object {
              "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"
            } |
            Set-Content -Encoding ascii (Join-Path $root "SHA256SUMS.txt")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordHDRFix-v1.2.2-stream-ui-fix-windows-x64
          path: package/DiscordHDRFix-v1.2.2-stream-ui-fix
          if-no-files-found: error
          retention-days: 30
